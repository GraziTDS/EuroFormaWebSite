@if (dados(); as d) {
  <div class="euro-page">
    <div class="dashboard__topo">
      <h2>Dashboard</h2>
      <a mat-flat-button color="primary" routerLink="/educador/cadastro">Cadastrar educando</a>
    </div>

    <div class="dashboard__stats">
      <app-stat-card icon="groups" label="Total de alunos" [value]="d.totalAlunos" />
      <app-stat-card icon="person" label="Alunos ativos" [value]="d.ativos" />
      <app-stat-card icon="school" label="Concluintes" [value]="d.concluintes" />
      <app-stat-card icon="trending_up" label="Taxa de conclusão" [value]="d.taxaConclusao + '%'" />
    </div>

    <div class="dashboard__graficos">
      <app-section-card titulo="Novas matrículas por mês" class="dashboard__evolucao">
        <div class="grafico-wrapper">
          <canvas baseChart [data]="evolucaoData()" [options]="evolucaoOptions" type="line"></canvas>
        </div>
      </app-section-card>

      <app-section-card titulo="Distribuição por status" class="dashboard__distribuicao">
        @for (par of d.distribuicaoPorStatus | keyvalue; track par.key) {
          <div class="distribuicao-item">
            <app-status-chip [status]="$any(par.key)" />
            <div class="distribuicao-item__barra">
              <div class="distribuicao-item__preenchido" [style.width.%]="((par.value ?? 0) / maiorDistribuicao()) * 100"></div>
            </div>
            <span>{{ par.value }}</span>
          </div>
        }
      </app-section-card>
    </div>

    <app-section-card titulo="Educandos recentes">
      @for (educando of d.recentes; track educando.id) {
        <a class="educando-item" [routerLink]="['/educador/educandos', educando.id]">
          <span>{{ educando.nome }}</span>
          <span class="educando-item__curso">{{ educando.curso }}</span>
          <app-status-chip [status]="educando.status" />
        </a>
      }
      <a routerLink="/educador/educandos">Ver todos →</a>
    </app-section-card>
  </div>
}
