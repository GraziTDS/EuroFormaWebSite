<div class="shell">
  <header class="shell__toolbar">
    <div class="shell__brand">
      <span class="shell__logo"><mat-icon>school</mat-icon></span>
      <span class="shell__brand-text">
        <strong>euroForma</strong>
        <small>INSTITUTO EUROFARMA</small>
      </span>
    </div>

    <nav class="shell__nav">
      @for (item of itensNav(); track item.caminho) {
        <a [routerLink]="item.caminho" routerLinkActive="ativo">{{ item.rotulo }}</a>
      }
    </nav>

    <span class="shell__spacer"></span>

    <span class="shell__perfil-badge">
      <span class="shell__perfil-dot"></span>
      {{ rotuloPerfil() }}
    </span>

    <span class="shell__usuario">
      <strong>{{ usuario()?.nome }}</strong>
      <small>{{ usuario()?.email }}</small>
    </span>

    <button mat-icon-button (click)="sair()" aria-label="Sair" title="Sair" class="shell__logout">
      <mat-icon>logout</mat-icon>
    </button>
  </header>

  <main class="shell__conteudo">
    <router-outlet />
  </main>

  @if (ehEducando()) {
    <app-assistente-curriculo />
  }
</div>
