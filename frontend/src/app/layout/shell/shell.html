<div class="shell">
  <mat-toolbar class="shell__toolbar">
    <span class="shell__brand">euroForma</span>

    <nav class="shell__nav">
      @for (item of itensNav(); track item.caminho) {
        <a [routerLink]="item.caminho" routerLinkActive="ativo">{{ item.rotulo }}</a>
      }
    </nav>

    <span class="shell__spacer"></span>

    <span class="shell__usuario">{{ usuario()?.nome }}</span>
    <button mat-icon-button (click)="sair()" aria-label="Sair" title="Sair">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <main class="shell__conteudo">
    <router-outlet />
  </main>
</div>
