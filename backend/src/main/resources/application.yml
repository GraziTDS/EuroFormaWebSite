spring:
  application:
    name: euroforma
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:euroforma}
    username: ${DB_USER:euroforma}
    password: ${DB_PASSWORD:euroforma}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

euroforma:
  jwt:
    secret: ${JWT_SECRET:mude-esta-chave-em-producao-para-um-segredo-bem-mais-forte-1234567890}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  storage:
    local-dir: ${STORAGE_DIR:./uploads}
  mail:
    remetente: ${MAIL_REMETENTE:no-reply@euroforma.local}
  frontend:
    reset-senha-url: ${FRONTEND_RESET_SENHA_URL:http://localhost:4200/redefinir-senha}
